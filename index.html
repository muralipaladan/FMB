<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Full Screen Map & GPS</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
    }

    /* Bottom Left Controls */
    .bottom-left-bar {
      position: absolute;
      bottom: 20px;
      left: 15px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-action {
      background: #ffffff;
      color: #1a1a1a;
      border: none;
      padding: 10px 14px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn-gps {
      background: #007bff;
      color: #ffffff;
    }
    .btn-gps.active {
      background: #dc3545;
    }
    input[type="file"] {
      display: none;
    }

    /* Accurate Pulsing Blue Dot */
    .gps-dot-container {
      position: relative;
      width: 22px;
      height: 22px;
    }
    .gps-dot {
      width: 13px;
      height: 13px;
      background: #007bff;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.9);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .gps-pulse {
      width: 22px;
      height: 22px;
      background: rgba(0, 123, 255, 0.35);
      border-radius: 50%;
      animation: pulse-ring 1.8s infinite ease-out;
      position: absolute;
      top: 0;
      left: 0;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.8); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Bottom Left Controls -->
  <div class="bottom-left-bar">
    <button class="btn-action btn-gps" id="gpsBtn">
      <span>📍 Enable GPS</span>
    </button>

    <label class="btn-action" for="fileInput" id="fileBtn">
      <span>📁 Upload File</span>
    </label>
    <input type="file" id="fileInput" accept=".kmz,.kml,.png,.jpg,.jpeg" />
  </div>

  <!-- Leaflet & JSZip -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    // 1. Initialize Map with Google Hybrid & Road Map
    const map = L.map('map', {
      zoomControl: false,
      maxZoom: 22
    }).setView([11.3819, 75.7878], 15);

    // Google Hybrid Layer (Default)
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 22,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '&copy; Google Hybrid'
    }).addTo(map);

    // Google Road Map
    const googleRoadmap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 22,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '&copy; Google Roads'
    });

    // Layer Switcher (Hybrid & Road Map only)
    L.control.layers({
      "Google Hybrid": googleHybrid,
      "Google Road Map": googleRoadmap
    }, null, { position: 'topright' }).addTo(map);

    // 2. KMZ & Image File Loader
    let currentOverlay = null;

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();

      try {
        if (fileName.endsWith('.kmz')) {
          const zip = await JSZip.loadAsync(file);
          let kmlEntry = null;
          zip.forEach((path, entry) => {
            if (path.toLowerCase().endsWith('.kml')) kmlEntry = entry;
          });

          if (!kmlEntry) throw new Error("KML file not found inside KMZ!");

          const kmlText = await kmlEntry.async('text');
          const parser = new DOMParser();
          const xml = parser.parseFromString(kmlText, 'text/xml');
          const overlay = xml.getElementsByTagName('GroundOverlay')[0];

          if (!overlay) throw new Error("GroundOverlay not found!");

          const href = overlay.getElementsByTagName('href')[0].textContent.trim();
          const north = parseFloat(overlay.getElementsByTagName('north')[0].textContent);
          const south = parseFloat(overlay.getElementsByTagName('south')[0].textContent);
          const east = parseFloat(overlay.getElementsByTagName('east')[0].textContent);
          const west = parseFloat(overlay.getElementsByTagName('west')[0].textContent);

          const imgEntry = zip.file(href) || zip.file(href.replace(/^files\//, ''));
          if (!imgEntry) throw new Error("Image file not found in KMZ.");

          const blob = await imgEntry.async('blob');
          const imgUrl = URL.createObjectURL(blob);
          const bounds = [[south, west], [north, east]];

          if (currentOverlay) map.removeLayer(currentOverlay);

          currentOverlay = L.imageOverlay(imgUrl, bounds, { opacity: 0.85 }).addTo(map);
          map.fitBounds(bounds);

        } else if (file.type.startsWith('image/')) {
          const imgUrl = URL.createObjectURL(file);
          const bounds = map.getBounds();
          if (currentOverlay) map.removeLayer(currentOverlay);
          currentOverlay = L.imageOverlay(imgUrl, bounds, { opacity: 0.85 }).addTo(map);
        }
      } catch (err) {
        alert("File Error: " + err.message);
      }
    });

    // 3. Accurate Mobile Live GPS (Pulsing Blue Dot)
    let watchId = null;
    let gpsMarker = null;
    let accuracyCircle = null;

    const gpsBtn = document.getElementById('gpsBtn');

    const blueDotIcon = L.divIcon({
      className: 'gps-dot-icon',
      html: '<div class="gps-dot-container"><div class="gps-pulse"></div><div class="gps-dot"></div></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    gpsBtn.addEventListener('click', () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        gpsBtn.innerHTML = '<span>📍 Enable GPS</span>';
        gpsBtn.classList.remove('active');
        if (gpsMarker) map.removeLayer(gpsMarker);
        if (accuracyCircle) map.removeLayer(accuracyCircle);
        return;
      }

      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your device.");
        return;
      }

      gpsBtn.innerHTML = '<span>🛑 Stop GPS</span>';
      gpsBtn.classList.add('active');

      let firstFix = true;

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const acc = pos.coords.accuracy;
          const latlng = [lat, lng];

          if (!gpsMarker) {
            gpsMarker = L.marker(latlng, { icon: blueDotIcon, zIndexOffset: 1000 }).addTo(map);
            accuracyCircle = L.circle(latlng, {
              radius: acc,
              color: '#007bff',
              weight: 1.5,
              fillColor: '#007bff',
              fillOpacity: 0.12
            }).addTo(map);
          } else {
            gpsMarker.setLatLng(latlng);
            accuracyCircle.setLatLng(latlng);
            accuracyCircle.setRadius(acc);
          }

          if (firstFix) {
            map.setView(latlng, 18);
            firstFix = false;
          }
        },
        (err) => {
          alert("GPS Signal Error: " + err.message);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    });
  </script>
</body>
</html>
