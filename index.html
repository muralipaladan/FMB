<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KMZ / FMB GroundOverlay & Live GPS Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
    }
    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-width: 320px;
      width: calc(100% - 20px);
    }
    .panel h3 {
      font-size: 15px;
      margin-bottom: 8px;
      color: #333;
    }
    .control-group {
      margin-bottom: 8px;
    }
    input[type="file"] {
      width: 100%;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      padding: 8px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      margin-top: 5px;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    .btn-stop {
      background-color: #dc3545;
    }
    .btn-stop:hover {
      background-color: #a71d2a;
    }
    .slider-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 5px;
    }
    .status {
      font-size: 11px;
      color: #666;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h3>🗺️ KMZ GroundOverlay & Live GPS</h3>
    
    <div class="control-group">
      <input type="file" id="kmzInput" accept=".kmz,.kml" />
    </div>

    <div class="slider-container">
      <label for="opacitySlider">Overlay Opacity:</label>
      <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.85" />
    </div>

    <button id="gpsBtn" class="btn">📍 Start Live GPS</button>
    <div id="status" class="status">KMZ ഫയൽ അപ്‌ലോഡ് ചെയ്യുക...</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    // 1. Initialize Map (Google Satellite / Hybrid base layer)
    const map = L.map('map', {
      maxZoom: 22
    }).setView([11.3817, 75.7878], 14);

    // Satellite layer (ESRI World Imagery)
    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
      maxZoom: 20
    }).addTo(map);

    // OpenStreetMap as alternative
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    });

    L.control.layers({
      "ESRI Satellite": esriSatellite,
      "OpenStreetMap": osmLayer
    }).addTo(map);

    let overlayLayer = null;
    let gpsMarker = null;
    let accuracyCircle = null;
    let watchId = null;

    const statusEl = document.getElementById('status');
    const opacitySlider = document.getElementById('opacitySlider');

    // 2. KMZ Parser and GroundOverlay Renderer
    document.getElementById('kmzInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.innerHTML = "ഫയൽ വായിക്കുന്നു...";

      try {
        if (file.name.endsWith('.kmz')) {
          const zip = await JSZip.loadAsync(file);
          
          // KML ഫയൽ കണ്ടെത്തുന്നു
          let kmlFile = null;
          zip.forEach((path, zipEntry) => {
            if (path.toLowerCase().endsWith('.kml')) {
              kmlFile = zipEntry;
            }
          });

          if (!kmlFile) throw new Error("KML file not found inside KMZ!");

          const kmlText = await kmlFile.async("text");
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(kmlText, "text/xml");

          // GroundOverlay കണ്ടെത്തുന്നു
          const groundOverlay = xmlDoc.getElementsByTagName("GroundOverlay")[0];
          if (!groundOverlay) throw new Error("No GroundOverlay found in this KMZ.");

          const href = groundOverlay.getElementsByTagName("href")[0].textContent.trim();
          const north = parseFloat(groundOverlay.getElementsByTagName("north")[0].textContent);
          const south = parseFloat(groundOverlay.getElementsByTagName("south")[0].textContent);
          const east = parseFloat(groundOverlay.getElementsByTagName("east")[0].textContent);
          const west = parseFloat(groundOverlay.getElementsByTagName("west")[0].textContent);

          // ZIP-ൽ നിന്ന് ഇമേജ് എക്സ്ട്രാക്റ്റ് ചെയ്യുന്നു
          const imageFile = zip.file(href) || zip.file(href.replace(/^files\//, ''));
          if (!imageFile) throw new Error("Overlay image (" + href + ") not found in KMZ.");

          const imgBlob = await imageFile.async("blob");
          const imgUrl = URL.createObjectURL(imgBlob);

          const bounds = [[south, west], [north, east]];

          if (overlayLayer) map.removeLayer(overlayLayer);

          overlayLayer = L.imageOverlay(imgUrl, bounds, {
            opacity: parseFloat(opacitySlider.value),
            interactive: true
          }).addTo(map);

          map.fitBounds(bounds);
          statusEl.innerHTML = `✅ <b>Overlay Loaded</b><br>N: ${north.toFixed(4)}, S: ${south.toFixed(4)}<br>E: ${east.toFixed(4)}, W: ${west.toFixed(4)}`;

        } else {
          statusEl.innerHTML = "ദയവായി .KMZ ഫയൽ അപ്‌ലോഡ് ചെയ്യുക.";
        }
      } catch (err) {
        statusEl.innerHTML = `<span style="color:red">Error: ${err.message}</span>`;
      }
    });

    // Opacity control
    opacitySlider.addEventListener('input', function(e) {
      if (overlayLayer) {
        overlayLayer.setOpacity(parseFloat(e.target.value));
      }
    });

    // 3. High-Accuracy Live GPS Blue Dot Tracking
    const gpsBtn = document.getElementById('gpsBtn');

    gpsBtn.addEventListener('click', function() {
      if (watchId !== null) {
        // Stop tracking
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        if (gpsMarker) map.removeLayer(gpsMarker);
        if (accuracyCircle) map.removeLayer(accuracyCircle);
        gpsBtn.innerText = "📍 Start Live GPS";
        gpsBtn.classList.remove('btn-stop');
        statusEl.innerHTML = "GPS ട്രാക്കിംഗ് നിർത്തി.";
        return;
      }

      if (!navigator.geolocation) {
        alert("നിങ്ങളുടെ ബ്രൗസർ Geolocation സപ്പോർട്ട് ചെയ്യുന്നില്ല.");
        return;
      }

      statusEl.innerHTML = "GPS ലൊക്കേഷൻ കണ്ടെത്തുന്നു...";

      const blueDotIcon = L.divIcon({
        className: 'gps-blue-dot',
        html: `<div style="
          width: 14px;
          height: 14px;
          background: #007bff;
          border-radius: 50%;
          border: 3px solid white;
          box-shadow: 0 0 8px rgba(0,123,255,0.8);
        "></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;

          const latlng = [lat, lng];

          if (!gpsMarker) {
            gpsMarker = L.marker(latlng, { icon: blueDotIcon }).addTo(map);
            accuracyCircle = L.circle(latlng, {
              radius: accuracy,
              color: '#007bff',
              fillColor: '#007bff',
              fillOpacity: 0.15,
              weight: 1
            }).addTo(map);

            map.setView(latlng, 18);
          } else {
            gpsMarker.setLatLng(latlng);
            accuracyCircle.setLatLng(latlng);
            accuracyCircle.setRadius(accuracy);
          }

          statusEl.innerHTML = `📍 <b>Live GPS Active</b><br>Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}<br>Accuracy: ±${Math.round(accuracy)} meters`;
        },
        (err) => {
          statusEl.innerHTML = `<span style="color:red">GPS Error: ${err.message}</span>`;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );

      gpsBtn.innerText = "🛑 Stop Live GPS";
      gpsBtn.classList.add('btn-stop');
    });
  </script>
</body>
</html>
