<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Clean Map & GPS</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
    }

    /* Bottom-Left Minimal Control Bar */
    .compact-bar {
      position: absolute;
      bottom: 24px;
      left: 14px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.92);
      padding: 6px 12px;
      border-radius: 40px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(6px);
    }

    /* Circular GPS Button like Google Maps */
    .btn-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #5f6368;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .btn-circle svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .btn-circle.active {
      background: #1a73e8;
      color: #ffffff;
    }

    /* Folder Icon Upload Button */
    .btn-folder {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f1f3f4;
      color: #3c4043;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }
    .btn-folder:hover {
      background: #e8eaed;
    }
    .btn-folder svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    input[type="file"] {
      display: none;
    }

    /* Compact Slider */
    .slider-box {
      display: flex;
      align-items: center;
      width: 90px;
    }
    .slider-box input[type="range"] {
      width: 100%;
      height: 5px;
      border-radius: 3px;
      accent-color: #1a73e8;
      outline: none;
    }

    /* Live GPS Pulsing Blue Dot */
    .gps-dot-container {
      position: relative;
      width: 22px;
      height: 22px;
    }
    .gps-dot {
      width: 13px;
      height: 13px;
      background: #1a73e8;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 8px rgba(26, 115, 232, 0.9);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .gps-pulse {
      width: 22px;
      height: 22px;
      background: rgba(26, 115, 232, 0.35);
      border-radius: 50%;
      animation: pulse-ring 1.8s infinite ease-out;
      position: absolute;
      top: 0;
      left: 0;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.8); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Bottom Left Floating Control Strip -->
  <div class="compact-bar">
    <!-- Google Maps Style Location Crosshair Button -->
    <button class="btn-circle" id="gpsBtn" title="Current Location">
      <svg viewBox="0 0 24 24">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
      </svg>
    </button>

    <!-- Folder Icon for Uploading KMZ / Images -->
    <label class="btn-folder" for="fileInput" title="Upload KMZ / Image">
      <svg viewBox="0 0 24 24">
        <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
      </svg>
    </label>
    <input type="file" id="fileInput" accept=".kmz,.kml,.png,.jpg,.jpeg" />

    <!-- Compact Slider for Overlay Opacity -->
    <div class="slider-box" title="Opacity">
      <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.85" />
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    // 1. Map Setup (Google Hybrid & Roads Only)
    const map = L.map('map', {
      zoomControl: false,
      maxZoom: 22
    }).setView([11.3819, 75.7878], 15);

    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 22,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    }).addTo(map);

    const googleRoadmap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 22,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    });

    L.control.layers({
      "Google Hybrid": googleHybrid,
      "Google Road": googleRoadmap
    }, null, { position: 'topright' }).addTo(map);

    // 2. KMZ & Image Parser
    let currentOverlay = null;
    const opacitySlider = document.getElementById('opacitySlider');

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();

      try {
        if (fileName.endsWith('.kmz')) {
          const zip = await JSZip.loadAsync(file);
          let kmlEntry = null;
          zip.forEach((path, entry) => {
            if (path.toLowerCase().endsWith('.kml')) kmlEntry = entry;
          });

          if (!kmlEntry) throw new Error("KML file missing in KMZ");

          const kmlText = await kmlEntry.async('text');
          const xml = new DOMParser().parseFromString(kmlText, 'text/xml');
          const overlay = xml.getElementsByTagName('GroundOverlay')[0];
          if (!overlay) throw new Error("GroundOverlay missing");

          const href = overlay.getElementsByTagName('href')[0].textContent.trim();
          const north = parseFloat(overlay.getElementsByTagName('north')[0].textContent);
          const south = parseFloat(overlay.getElementsByTagName('south')[0].textContent);
          const east = parseFloat(overlay.getElementsByTagName('east')[0].textContent);
          const west = parseFloat(overlay.getElementsByTagName('west')[0].textContent);

          const imgEntry = zip.file(href) || zip.file(href.replace(/^files\//, ''));
          if (!imgEntry) throw new Error("Overlay image not found");

          const blob = await imgEntry.async('blob');
          const imgUrl = URL.createObjectURL(blob);
          const bounds = [[south, west], [north, east]];

          if (currentOverlay) map.removeLayer(currentOverlay);
          currentOverlay = L.imageOverlay(imgUrl, bounds, { opacity: parseFloat(opacitySlider.value) }).addTo(map);
          map.fitBounds(bounds);

        } else if (file.type.startsWith('image/')) {
          const imgUrl = URL.createObjectURL(file);
          const bounds = map.getBounds();
          if (currentOverlay) map.removeLayer(currentOverlay);
          currentOverlay = L.imageOverlay(imgUrl, bounds, { opacity: parseFloat(opacitySlider.value) }).addTo(map);
        }
      } catch (err) {
        alert(err.message);
      }
    });

    opacitySlider.addEventListener('input', (e) => {
      if (currentOverlay) currentOverlay.setOpacity(parseFloat(e.target.value));
    });

    // 3. Google Maps Style High Accuracy Blue Dot GPS
    let watchId = null;
    let gpsMarker = null;
    let accuracyCircle = null;

    const gpsBtn = document.getElementById('gpsBtn');

    const blueDotIcon = L.divIcon({
      className: 'gps-dot-icon',
      html: '<div class="gps-dot-container"><div class="gps-pulse"></div><div class="gps-dot"></div></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    gpsBtn.addEventListener('click', () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        gpsBtn.classList.remove('active');
        if (gpsMarker) map.removeLayer(gpsMarker);
        if (accuracyCircle) map.removeLayer(accuracyCircle);
        return;
      }

      if (!navigator.geolocation) {
        alert("GPS not supported");
        return;
      }

      gpsBtn.classList.add('active');
      let firstFix = true;

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const acc = pos.coords.accuracy;
          const latlng = [lat, lng];

          if (!gpsMarker) {
            gpsMarker = L.marker(latlng, { icon: blueDotIcon, zIndexOffset: 1000 }).addTo(map);
            accuracyCircle = L.circle(latlng, {
              radius: acc,
              color: '#1a73e8',
              weight: 1,
              fillColor: '#1a73e8',
              fillOpacity: 0.12
            }).addTo(map);
          } else {
            gpsMarker.setLatLng(latlng);
            accuracyCircle.setLatLng(latlng);
            accuracyCircle.setRadius(acc);
          }

          if (firstFix) {
            map.setView(latlng, 18);
            firstFix = false;
          }
        },
        (err) => {
          alert("GPS: " + err.message);
          gpsBtn.classList.remove('active');
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    });
  </script>
</body>
</html>
